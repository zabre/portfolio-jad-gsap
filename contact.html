<form
  class="brief-form"
  id="contactForm"
  name="contact"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  action="/merci.html"
>
  <input type="hidden" name="form-name" value="contact" />

  <p class="form-hidden">
    <label>
      Ne pas remplir ce champ :
      <input name="bot-field" />
    </label>
  </p>

  <div class="brief-form-grid">
    <div class="brief-field">
      <label for="name">Nom</label>
      <input
        id="name"
        type="text"
        name="name"
        placeholder="Ton nom"
        required
        autocomplete="name"
      />
    </div>

    <div class="brief-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="ton@email.com"
        required
        autocomplete="email"
      />
    </div>

    <div class="brief-field">
      <label for="project-type">Type de projet</label>
      <select id="project-type" name="project_type" required>
        <option value="">Sélectionne une option</option>
        <option value="creation-contenu">Création de contenu</option>
        <option value="brand-content">Brand content</option>
        <option value="ux-ui">UX/UI Design</option>
        <option value="direction-artistique">Direction artistique</option>
        <option value="collaboration">Collaboration</option>
        <option value="autre">Autre</option>
      </select>
    </div>

    <div class="brief-field">
      <label for="budget">Budget</label>
      <select id="budget" name="budget">
        <option value="">Budget approximatif</option>
        <option value="moins-1000">Moins de 1 000 €</option>
        <option value="1000-3000">1 000 — 3 000 €</option>
        <option value="3000-5000">3 000 — 5 000 €</option>
        <option value="5000-plus">5 000 € +</option>
        <option value="a-definir">À définir</option>
      </select>
    </div>

    <div class="brief-field">
      <label for="timeline">Timing</label>
      <select id="timeline" name="timeline">
        <option value="">Timing du projet</option>
        <option value="urgent">Urgent</option>
        <option value="1-mois">Dans le mois</option>
        <option value="1-3-mois">1 à 3 mois</option>
        <option value="plus-tard">Plus tard</option>
        <option value="a-definir">À définir</option>
      </select>
    </div>

    <div class="brief-field brief-field-message">
      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        rows="6"
        placeholder="Parle-moi du projet, de l’objectif, du contexte..."
        required
      ></textarea>
    </div>
  </div>

  <button type="submit" class="brief-submit">
    Envoyer le brief ↗
  </button>

  <p class="brief-note">
    Réponse sous 24–48h selon disponibilité.
  </p>
</form>
